[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ent"
version = "0.1.0"
description = "AI-Enterprise bootstrap foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "pydantic>=2.10",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1",
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
aient-bootstrap = "ai_ent.bootstrap_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
