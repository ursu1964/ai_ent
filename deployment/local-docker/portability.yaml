package:
  id: DEP-PKG-LOCAL-DOCKER-001
  name: Local Docker host deployment package
  classification: NORMATIVE
  target: local_docker_host
  source_refs:
    - R12
    - R20
    - R21
    - R22
    - BEAG-001

package_files:
  - path: deployment/local-docker/README.md
    role: operator_instructions
    classification: NORMATIVE
  - path: deployment/local-docker/Dockerfile
    role: operator_image
    classification: NORMATIVE
  - path: deployment/local-docker/compose.yaml
    role: local_host_orchestration
    classification: NORMATIVE
  - path: deployment/local-docker/portability.yaml
    role: portability_contract
    classification: NORMATIVE
  - path: deployment/local-docker/operator-env.template
    role: private_environment_template
    classification: NORMATIVE

deployment_modes:
  - id: USE_EXISTING_POSTGRES
    default: true
    description: Preserve the existing authoritative PostgreSQL service and run the product launcher on loopback.
    required: true
  - id: ACCESS_MODE_LOCAL
    default: true
    description: Safe default product access mode; permits only loopback product listeners.
    selector: AIENT_PRODUCT_ACCESS_MODE=local
    wildcard_bind_allowed: false
    lan_bind_allowed: false
  - id: ACCESS_MODE_LAN
    default: false
    description: Explicit controlled private-LAN product access mode for validation after GATE-PRD-LAN-ACCESS approval.
    selector: AIENT_PRODUCT_ACCESS_MODE=lan
    requires_exact_private_interface: true
    requires_allowed_origins: true
    wildcard_bind_allowed: false
    public_exposure_allowed: false
    postgresql_lan_exposure_allowed: false

launcher:
  command:
    - aient-product-local
    - serve
    - --env-file
    - .env
  validation_command:
    - aient-product-local
    - validate-config
    - --env-file
    - .env
  bind_default: 127.0.0.1
  port_default: 8000
  wildcard_bind_allowed: false
  access_mode_default: local
  lan_requires_explicit_private_bind: true
  lan_inferred_from_bind_host: false
  requires_existing_postgres: true
  requires_operator_bootstrap: true

decision_dependencies:
  - PRD-DEC-002
  - PRD-DEC-003

authority:
  control_plane_backend: postgresql
  control_plane_source: manifest/project/ai-ent/project.yaml
  operator_invocation_required: true
  completion_authority: bootstrap_acceptance_gate

human_gates:
  - id: HG-LOCAL-001
    action: guarded_autonomous_run
    required: true
  - id: HG-LOCAL-002
    action: migration_or_restore
    required: true
  - id: HG-LOCAL-003
    action: cloud_target_selection
    required: true

migration_boundaries:
  - id: MB-LOCAL-001
    boundary: docker_host_only
    future_cloud_status: deferred
  - id: MB-LOCAL-002
    boundary: package_must_not_redefine_control_plane_authority
    future_cloud_status: decision_required

verification:
  independent_verification_mandatory: true
  commands:
    - /home/user/projects/ai_ent/aient/bin/python -m pytest -q
    - /home/user/projects/ai_ent/aient/bin/python -m ruff check .
    - /home/user/projects/ai_ent/aient/bin/python -m pyright

secret_policy:
  embedded_secret_values_allowed: false
  operator_provided_environment:
    - AIENT_DB_PASSWORD
    - AIENT_OPERATOR_PASSWORD_HASH
