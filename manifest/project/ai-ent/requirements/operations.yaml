requirements:
  - id: OPS-001
    title: Runtime kernel supervises execution and enforces lifecycle state
    classification: NORMATIVE
    source_refs: [R20, R21]
    capabilities: [C20]
  - id: OPS-002
    title: Crash recovery must inspect durable state before resuming work
    classification: NORMATIVE
    source_refs: [R12, R21, BEAG-001]
    capabilities: [C12, C20]
  - id: OPS-003
    title: Operator guarded runs must remain bounded
    classification: NORMATIVE
    source_refs: [BEAG-001]
    capabilities: [C12, C20]
  - id: OPS-004
    title: Runtime cleanup must default to dry-run and require explicit operator confirmation before mutation
    classification: NORMATIVE
    source_refs: [BEAG-001, R20, R21]
    capabilities: [C12, C20]
  - id: OPS-005
    title: Migrations and restore drills must preserve PostgreSQL control-plane authority, explicit human gates, and independent verification profiles
    classification: NORMATIVE
    source_refs: [BEAG-001, R17, R20, R22]
    capabilities: [C12, C17, C20]
  - id: OPS-006
    title: Guarded runtime shutdown must stop at a durable task boundary without starting new claims
    classification: NORMATIVE
    source_refs: [BEAG-001, R21]
    capabilities: [C12, C20]
