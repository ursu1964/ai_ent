deployment:
  id: DEP-001
  classification: FUTURE/DEFERRED
  source_refs: [R12, R20]
  current_mode: local_development
  package_refs:
    - DEP-PKG-LOCAL-DOCKER-001
  local_docker_package:
    path: deployment/local-docker
    portability_contract: deployment/local-docker/portability.yaml
    compose_file: deployment/local-docker/compose.yaml
    private_environment_boundary: operator_supplied_runtime_values
    decision_dependencies:
      - PRD-DEC-002
      - PRD-DEC-003
  next_required_decision: production hosting target
  access_profile:
    id: ACCESS-LOCAL-LAN-001
    classification: NORMATIVE
    source_refs: [R12, R20]
    active_profile: local_loopback
    configured_profiles: [local_loopback, lan_gated]
    binding:
      bind_address: 127.0.0.1
      port: 8000
      lan_bind_address: explicit_private_interface_required
      lan_access_enabled: false
      blocked_by_decisions: [DECISION_REQUIRED:PRD-DEC-002]
    reverse_proxy:
      enabled: false
      provider: none
      allowed_providers: [caddy, nginx]
      decision_dependency: DECISION_REQUIRED:PRD-DEC-002
    tls:
      enabled: false
      mode: disabled_for_loopback
      required_for_lan: true
      certificate_material: not_configured_until_decision
    firewall_assumptions:
      host_firewall_managed_externally: true
      inbound_lan_ports_allowed: []
      inbound_public_ports_allowed: []
      operator_confirmation_required_for_changes: true
    safeguards:
      control_plane_authority: preserved
      human_gate: GATE-PRD-LAN-ACCESS
      independent_verification_required: true
      credential_values_exposed: false
